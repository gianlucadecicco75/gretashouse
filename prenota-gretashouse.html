<style>
  :root { --primary:#1e88e5; --accent:#2c3e50; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#faf6f4; color:#1a1a1a; }

  .section.alt { background:#fff; }

  .searchcard { background:#fff; border-radius:16px; padding:20px; margin-top:22px; box-shadow:0 6px 22px rgba(0,0,0,.1); position:relative; z-index:2; }

  /* Calendario disponibilità */
  .cal-wrap { margin-bottom:18px; }
  .cal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .cal-month { font-weight:700; font-size:15px; color:var(--accent); text-transform:capitalize; }
  .cal-nav { border:none; background:#f3ecea; width:32px; height:32px; border-radius:8px; font-size:17px; cursor:pointer; color:var(--accent); }
  .cal-nav:disabled { opacity:.35; cursor:default; }
  .cal-weekdays { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:11px; color:#9a8b88; text-transform:uppercase; margin-bottom:4px; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .cal-day { position:relative; text-align:center; padding:8px 0 10px; border-radius:8px; font-size:13.5px; cursor:pointer; border:1px solid transparent; color:#1a1a1a; }
  .cal-day .dot { display:block; width:5px; height:5px; border-radius:50%; margin:3px auto 0; background:#cfc4c1; }
  .cal-day.available .dot { background:#2e7d32; }
  .cal-day.unavailable { color:#c7bcb9; cursor:default; }
  .cal-day.unavailable .dot { background:#c0392b; }
  .cal-day.empty { visibility:hidden; cursor:default; }
  .cal-day.past { color:#d8cfcd; cursor:default; }
  .cal-day.past .dot { background:transparent; }
  .cal-day:not(.unavailable):not(.past):not(.empty):not(.selected):hover { background:#f3ecea; }
  .cal-day.selected { background:var(--primary); color:#fff; border-color:var(--primary); }

  .cal-day.in-range { background:#e8f0fb; }

  .cal-legend .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; vertical-align:middle; }
  .cal-legend .dot.available { background:#2e7d32; }
  .cal-legend .dot.unavailable { background:#c0392b; }
  .cal-selection { text-align:center; font-size:13.5px; font-weight:600; color:var(--accent); margin-top:12px; padding-top:12px; border-top:1px solid #f3ecea; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:10px; }
  .field label { display:block; font-size:11.5px; font-weight:700; color:#6b5b58; margin-bottom:4px; text-transform:uppercase; letter-spacing:.3px; }
  .field input, .field select { width:100%; padding:10px 11px; border:1px solid #ddd0cd; border-radius:8px; font-size:14px; background:#fff; }

  .overlay { position:fixed; inset:0; background:rgba(15,23,42,.55); display:flex; align-items:center; justify-content:center; z-index:1000; padding:16px; overflow-y:auto; }
  .modalbox { background:#fff; border-radius:16px; padding:24px; width:100%; max-width:420px; margin:auto; position:relative; color:#1a1a1a; }
  .modalbox h2 { margin:0 0 4px; font-size:18px; font-family:inherit; }

// ============================================================
// CONTENUTI DEL SITO — letti dalla maschera "Sito web" dentro DeskFlow (Impostazioni → Sito web).
// Se cambi testi/foto/colori li da DeskFlow, questa pagina li mostra in automatico al prossimo
// caricamento, senza bisogno di ricaricare o modificare questo file.
// ============================================================
// Calcola se un colore è chiaro o scuro (luminanza), per scegliere testo bianco o scuro sopra di
// esso e restare sempre leggibile qualunque sfondo venga scelto da Impostazioni → Sito web.
function coloreEChiaro(hex) {
  hex = (hex || '').replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(function(c){ return c+c; }).join('');
  if (hex.length !== 6) return false;
  var r = parseInt(hex.substr(0,2),16), g = parseInt(hex.substr(2,2),16), b = parseInt(hex.substr(4,2),16);
  var luminanza = (0.299*r + 0.587*g + 0.114*b) / 255;
  return luminanza > 0.6;
}

// ============================================================
// RICERCA DISPONIBILITA E PREZZI
// ============================================================
(function(){
  var sel = document.getElementById('q-adults');
  for (var i=1;i<=8;i++) sel.innerHTML += '<option value="'+i+'"'+(i===2?' selected':'')+'>'+i+'</option>';

// ============================================================
// CALENDARIO DISPONIBILITA (pallini verdi/rossi in base alle prenotazioni reali)
// ============================================================
var MESI_IT = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
var oggiDate = new Date(); oggiDate.setHours(0,0,0,0);
var meseVisualizzato = new Date(oggiDate.getFullYear(), oggiDate.getMonth(), 1);
var calSelCheckin = null, calSelCheckout = null;
var calRooms = null, calBookings = null;

function fmtISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtIT(iso){ var p = iso.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }

async function caricaDatiCalendario() {
  try {
    var risR = await sb.from('rooms').select('*').eq('status', 'disponibile');
    var risB = await sb.from('bookings').select('room_id, checkin, checkout, status').neq('status', 'cancellata');
    calRooms = risR.data || [];
    calBookings = risB.data || [];
  } catch (e) {
    console.error('Calendario: dati non caricati', e);
    calRooms = []; calBookings = [];
  }
  renderCalendario();
}

// Un giorno è "occupato" se TUTTE le unità disponibili risultano prenotate quella notte
function calGiornoOccupato(iso) {
  if (!calRooms || !calRooms.length) return false;
  var libera = calRooms.some(function(r){
    return !calBookings.some(function(b){ return b.room_id === r.id && b.checkin <= iso && b.checkout > iso; });
  });
  return !libera;
}

function renderCalendario() {
  var label = document.getElementById('cal-month-label');
  var grid = document.getElementById('cal-grid');
  if (!label || !grid) return;
  label.textContent = MESI_IT[meseVisualizzato.getMonth()] + ' ' + meseVisualizzato.getFullYear();

  var primoLimite = new Date(oggiDate.getFullYear(), oggiDate.getMonth(), 1);
  document.getElementById('cal-prev').disabled = (meseVisualizzato.getTime() <= primoLimite.getTime());

  var anno = meseVisualizzato.getFullYear(), mese = meseVisualizzato.getMonth();
  var primoGiorno = new Date(anno, mese, 1);
  var giorniNelMese = new Date(anno, mese+1, 0).getDate();
  var offset = (primoGiorno.getDay() + 6) % 7; // lun=0 ... dom=6

  var html = '';
  for (var i=0; i<offset; i++) html += '<div class="cal-day empty"></div>';

  for (var d=1; d<=giorniNelMese; d++) {
    var data = new Date(anno, mese, d);
    var iso = fmtISO(data);
    var classi = ['cal-day'];
    var clickAttr = '';
    if (data.getTime() < oggiDate.getTime()) {
      classi.push('past');
    } else if (calGiornoOccupato(iso)) {
      classi.push('unavailable');
    } else {
      classi.push('available');
      clickAttr = ' onclick="calSelezionaGiorno(\'' + iso + '\')"';
    }
    if (iso === calSelCheckin || iso === calSelCheckout) classi.push('selected');
    else if (calSelCheckin && calSelCheckout && iso > calSelCheckin && iso < calSelCheckout) classi.push('in-range');

    html += '<div class="' + classi.join(' ') + '"' + clickAttr + '>' + d + '<span class="dot"></span></div>';
  }
  grid.innerHTML = html;

  var sel = document.getElementById('cal-selection');
  if (calSelCheckin && calSelCheckout) {
    sel.textContent = 'Check-in ' + fmtIT(calSelCheckin) + '  →  Check-out ' + fmtIT(calSelCheckout);
  } else if (calSelCheckin) {
    sel.textContent = 'Check-in ' + fmtIT(calSelCheckin) + ' — ora seleziona il check-out';
  } else {
    sel.textContent = 'Seleziona la data di check-in';
  }
}

function calSelezionaGiorno(iso) {
  if (!calSelCheckin || (calSelCheckin && calSelCheckout)) {
    calSelCheckin = iso; calSelCheckout = null;
  } else if (iso <= calSelCheckin) {
    calSelCheckin = iso; calSelCheckout = null;
  } else {
    var cursore = new Date(calSelCheckin+'T00:00:00');
    var fine = new Date(iso+'T00:00:00');
    var tutteLibere = true;
    while (cursore < fine) {
      var ds = fmtISO(cursore);
      if (calGiornoOccupato(ds)) { tutteLibere = false; break; }
      cursore.setDate(cursore.getDate()+1);
    }
    if (!tutteLibere) {
      alert('Alcune notti in questo intervallo non sono libere. Scegli un altro periodo.');
      calSelCheckin = iso; calSelCheckout = null;
    } else {
      calSelCheckout = iso;
    }
  }
  document.getElementById('q-checkin').value = calSelCheckin || '';
  document.getElementById('q-checkout').value = calSelCheckout || '';
  renderCalendario();
}

function cambiaMese(dir) {
  meseVisualizzato = new Date(meseVisualizzato.getFullYear(), meseVisualizzato.getMonth()+dir, 1);
  renderCalendario();
}

caricaDatiCalendario();

function notti(checkin, checkout) {
  var a = new Date(checkin+'T00:00:00'), b = new Date(checkout+'T00:00:00');
  return Math.round((b-a) / 86400000);
}

function prezzoDirettoPerNotte(listinoRoom, pax, dataISO) {
  if (!listinoRoom) return 0;
  var pk = 'PAX' + pax;
  var periodi = listinoRoom.periodi || [];
  var giornoEsatto = periodi.find(function(p){ return p.dal === dataISO && p.al === dataISO; });
  if (giornoEsatto) {
    if (giornoEsatto.prezzi[pk]) return parseFloat(giornoEsatto.prezzi[pk]);
    if (giornoEsatto.prezzi.PAX1) return parseFloat(giornoEsatto.prezzi.PAX1);
  }
  for (var i=0;i<periodi.length;i++) {
    var p = periodi[i];
    if (p.dal === dataISO && p.al === dataISO) continue;
    if (p.dal <= dataISO && p.al >= dataISO) {
      if (p.prezzi[pk]) return parseFloat(p.prezzi[pk]);
      if (p.prezzi.PAX1) return parseFloat(p.prezzi.PAX1);
      if (p.prezzi.BASE) return parseFloat(p.prezzi.BASE);
    }
  }
  var prezzi = listinoRoom.prezzi || {};
  if (prezzi[pk]) return parseFloat(prezzi[pk]);
  if (prezzi.PAX1) return parseFloat(prezzi.PAX1);
  if (prezzi.BASE) return parseFloat(prezzi.BASE);
  return 0;
}

function calcolaOccupazionePerTipologia(rooms, bookings, ds, tipo) {
  var roomsDelTipo = rooms.filter(function(r){ return r.status==='disponibile' && (r.type||'Senza tipologia')===tipo; });
  if (!roomsDelTipo.length) return 0;
  var occupateOggi = bookings.filter(function(b){ return b.status!=='cancellata' && b.checkin<=ds && b.checkout>ds; });
  var occupiedIds = {};
  occupateOggi.forEach(function(b){ occupiedIds[b.room_id] = true; });
  var occupate = roomsDelTipo.filter(function(r){ return occupiedIds[r.id]; }).length;
  return Math.round((occupate/roomsDelTipo.length)*100);
}
function soglieAdjPerOccupazione(occ, soglie) {
  for (var i=0;i<soglie.length;i++) { var s=soglie[i]; if (occ>=s.min && occ<s.max) return s.adj; }
  return 0;
}
function eventiAttiviPerData(ds, eventi) {
  return eventi.filter(function(e){ return e.dal<=ds && e.al>=ds; });
}

function prezzoFinaleNotte(room, listinoRoom, pax, ds, ctx) {
  var prezzo = prezzoDirettoPerNotte(listinoRoom, pax, ds);
  if (!prezzo) return 0;
  var agg = (ctx.listinoAggiustamenti||[]).find(function(a){ return a.data===ds; });
  var totPct = agg ? agg.valore : 0;
  var eventi = eventiAttiviPerData(ds, (ctx.revenueConfig && ctx.revenueConfig.eventi) || []);
  totPct += eventi.reduce(function(s,e){ return s+(parseFloat(e.boost)||0); }, 0);
  var occ = calcolaOccupazionePerTipologia(ctx.rooms, ctx.bookings, ds, room.type||'Senza tipologia');
  totPct += soglieAdjPerOccupazione(occ, (ctx.revenueConfig && ctx.revenueConfig.soglie) || []);
  if (totPct) prezzo = Math.max(0, Math.round(prezzo*(1+totPct/100)*100)/100);
  return prezzo;
}

// Sconto per soggiorni lunghi — soglie e percentuali decise liberamente da Gian in Impostazioni
// (array di {notti, sconto}, es. [{notti:5,sconto:5},{notti:10,sconto:12}]). Si applica la soglia
// più alta tra quelle raggiunte dal numero di notti del soggiorno (non si sommano tra loro).
function scontoSoggiornoLungoPct(numNotti, soglie) {
  var migliore = 0;
  (soglie || []).forEach(function(s){
    var n = parseInt(s.notti) || 0;
    var sc = parseFloat(s.sconto) || 0;
    if (numNotti >= n && sc > migliore) migliore = sc;
  });
  return migliore;
}

function prezzoTotaleSoggiorno(room, listinoRoom, pax, checkin, checkout, ctx) {
  var tot = 0;
  var numNotti = 0;
  var cursore = new Date(checkin+'T00:00:00');
  var fine = new Date(checkout+'T00:00:00');
  while (cursore < fine) {
    var ds = cursore.getFullYear()+'-'+String(cursore.getMonth()+1).padStart(2,'0')+'-'+String(cursore.getDate()).padStart(2,'0');
    tot += prezzoFinaleNotte(room, listinoRoom, pax, ds, ctx);
    cursore.setDate(cursore.getDate()+1);
    numNotti++;
  }
  var scontoPct = scontoSoggiornoLungoPct(numNotti, ctx.scontiSoggiornoLungo);
  if (scontoPct > 0) tot = Math.round(tot * (1 - scontoPct/100) * 100) / 100;
  return tot;
}

var ultimaRicerca = null;

async function cercaDisponibilita() {
  var checkin = document.getElementById('q-checkin').value;
  var checkout = document.getElementById('q-checkout').value;
  var adults = parseInt(document.getElementById('q-adults').value) || 1;
  var children = parseInt(document.getElementById('q-children').value) || 0;
  var pax = adults + children;
  var n = notti(checkin, checkout);

  var results = document.getElementById('results');
  if (!checkin || !checkout || n < 1) {
    results.innerHTML = '<div class="msg">Seleziona date valide (il check-out deve essere dopo il check-in).</div>';
    return;
  }

  var btn = document.getElementById('btn-cerca');
  btn.disabled = true;
  btn.textContent = 'Ricerca in corso...';
  results.innerHTML = '<div class="msg">Controllo la disponibilita...</div>';

  try {
    var risR = await sb.from('rooms').select('*').eq('status', 'disponibile');
    var risB = await sb.from('bookings').select('room_id, checkin, checkout, status').neq('status', 'cancellata');
    var risL = await sb.from('listino').select('*').eq('tariffa_id', 'standard');
    var risRC = await sb.from('app_blobs').select('data').eq('key', 'revenueConfig').maybeSingle();
    var risLA = await sb.from('app_blobs').select('data').eq('key', 'listinoAggiustamenti').maybeSingle();
    var risRT = await sb.from('app_blobs').select('data').eq('key', 'regoleTipo').maybeSingle();
    var risSet = await sb.from('app_blobs').select('data').eq('key', 'settings').maybeSingle();
    if (risR.error) throw risR.error;
    if (risB.error) throw risB.error;
    if (risL.error) throw risL.error;
    var rooms = risR.data, bookings = risB.data, listino = risL.data;
    var minNottiPerTipo = (risRT.data && risRT.data.data && risRT.data.data.minNotti) || {};
    var ctx = {
      rooms: rooms,
      bookings: bookings,
      revenueConfig: (risRC.data && risRC.data.data) || { soglie: [], eventi: [] },
      listinoAggiustamenti: (risLA.data && risLA.data.data) || [],
      scontiSoggiornoLungo: (risSet.data && risSet.data.data && risSet.data.data.scontiSoggiornoLungo) || []
    };

    var occupatePerCamera = {};
    (bookings || []).forEach(function(b){
      if (b.checkin < checkout && b.checkout > checkin) occupatePerCamera[b.room_id] = true;
    });

    // Il soggiorno minimo si applica in base al giorno di arrivo (stesso criterio usato nel
    // gestionale): se per quella data/tipologia è richiesto un minimo di notti maggiore di quelle
    // scelte, quella camera non compare tra i risultati.
    function minNottiRichiesto(tipo) {
      var mappa = minNottiPerTipo[tipo || 'Senza tipologia'] || {};
      return parseInt(mappa[checkin]) || 1;
    }

    var camereLibere = (rooms || []).filter(function(r){
      return !occupatePerCamera[r.id] && (r.capacity || 99) >= pax && n >= minNottiRichiesto(r.type);
    });

    if (!camereLibere.length) {
      var minRichiestoMax = Math.max.apply(null, (rooms||[]).map(function(r){ return minNottiRichiesto(r.type); }).concat([1]));
      var messaggioMin = (minRichiestoMax > n)
        ? ('Per le date scelte è richiesto un soggiorno minimo di ' + minRichiestoMax + ' nott' + (minRichiestoMax===1?'e':'i') + '. Prova ad allungare il soggiorno.')
        : 'Nessuna unita disponibile per queste date/ospiti. Prova con altre date, oppure scrivici direttamente.';
      results.innerHTML = '<div class="msg">' + messaggioMin + '</div>';
      return;
    }

    ultimaRicerca = { checkin: checkin, checkout: checkout, adults: adults, children: children, n: n };

    results.innerHTML = camereLibere.map(function(r){
      var listinoRoom = (listino || []).find(function(l){ return l.room_id === r.id; });
      var totale = prezzoTotaleSoggiorno(r, listinoRoom, pax, checkin, checkout, ctx);
      var perNotte = totale / n;
      var scontoAttivo = scontoSoggiornoLungoPct(n, ctx.scontiSoggiornoLungo);
      return '<div class="roomcard">' +
        '<div class="rn">' + r.name + ' per ' + pax + ' person' + (pax===1?'a':'e') + '</div>' +
        '<div class="rt">' + (r.type||'') + '</div>' +
        (scontoAttivo>0 ? '<div style="display:inline-block;background:#e8f5e9;color:#2e7d32;font-size:11px;font-weight:700;padding:2px 8px;border-radius:12px;margin-bottom:4px">🎉 Sconto soggiorno lungo -' + scontoAttivo + '% già applicato</div>' : '') +
        '<div class="price-row">' +
          '<div class="price">EUR ' + totale.toFixed(2) + '<br><small>' + n + ' nott' + (n===1?'e':'i') + ' - EUR ' + perNotte.toFixed(2) + '/notte</small></div>' +
          '<button onclick="apriPrenotazione(\'' + r.id + '\', \'' + r.name.replace(/'/g,"\\'") + '\', ' + totale.toFixed(2) + ')">Prenota</button>' +
        '</div>' +
      '</div>';
    }).join('');
  } catch (err) {
    console.error(err);
    results.innerHTML = '<div class="msg">Errore nel controllare la disponibilita - riprova tra poco.</div>';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Cerca disponibilita';
  }
}

function apriPrenotazione(roomId, roomName, totale) {
  var div = document.createElement('div');
  div.id = 'book-overlay';
  div.className = 'overlay';
  div.innerHTML =
    '<div class="modalbox">' +
      '<button class="close" onclick="document.getElementById(\'book-overlay\').remove()">X</button>' +
      '<h2>Completa la prenotazione</h2>' +
      '<div class="rowinfo"><span>Unita</span><span><b>' + roomName + '</b></span></div>' +
      '<div class="rowinfo"><span>Check-in</span><span>' + ultimaRicerca.checkin + '</span></div>' +
      '<div class="rowinfo"><span>Check-out</span><span>' + ultimaRicerca.checkout + '</span></div>' +
      '<div class="rowinfo"><span>Totale</span><span><b>EUR ' + totale.toFixed(2) + '</b></span></div>' +
      '<div class="field"><label>Nome e cognome</label><input type="text" id="p-nome"></div>' +
      '<div class="field"><label>Email</label><input type="email" id="p-email"></div>' +
      '<div class="field"><label>Telefono</label><input type="text" id="p-telefono"></div>' +
      '<div class="field"><label>Note (opzionale)</label><input type="text" id="p-note"></div>' +
      '<button class="btn btn-primary" id="btn-conferma" onclick="confermaPrenotazione(\'' + roomId + '\', \'' + roomName.replace(/'/g,"\\'") + '\', ' + totale.toFixed(2) + ')">Conferma prenotazione</button>' +
      '<div style="font-size:11px;color:#9a8b88;margin-top:10px">Prenotazione diretta, senza carta di credito. Ti contatteremo per confermare i dettagli del check-in.</div>' +
    '</div>';
  document.body.appendChild(div);
}

async function confermaPrenotazione(roomId, roomName, totale) {
  var nome = (document.getElementById('p-nome')||{value:''}).value.trim();
  var email = (document.getElementById('p-email')||{value:''}).value.trim();
  var telefono = (document.getElementById('p-telefono')||{value:''}).value.trim();
  var note = (document.getElementById('p-note')||{value:''}).value.trim();
  if (!nome || !email) { alert('Inserisci almeno nome e email.'); return; }

  var btn = document.getElementById('btn-conferma');
  btn.disabled = true;
  btn.textContent = 'Invio in corso...';

  try {
    var guestId = null;
    var risG = await sb.from('guests').select('id').eq('email', email).maybeSingle();
    if (risG.data) {
      guestId = risG.data.id;
    } else {
      guestId = 'g_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
      var errG = (await sb.from('guests').insert({ id: guestId, name: nome, email: email, phone: telefono })).error;
      if (errG) throw errG;
    }

    var bookingId = 'b_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
    var errB = (await sb.from('bookings').insert({
      id: bookingId,
      guest_id: guestId,
      guest_name: nome,
      room_id: roomId,
      room_name: roomName,
      checkin: ultimaRicerca.checkin,
      checkout: ultimaRicerca.checkout,
      adults: ultimaRicerca.adults,
      children: ultimaRicerca.children,
      source: 'Sito web',
      status: 'confermata',
      total_price: totale,
      pagato: 'no',
      notes: note,
      created_at: new Date().toISOString()
    })).error;
    if (errB) throw errB;

    try {
      var risBlob = await sb.from('app_blobs').select('data').eq('key', 'settings').maybeSingle();
      var s = (risBlob.data && risBlob.data.data) || {};
      if (s.emailInvioPromemoria && s.passwordInvioPromemoria) {
        var functionUrl = SUPABASE_URL + '/functions/v1/invio-ricevuta';
        fetch(functionUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer '+SUPABASE_ANON_KEY, 'apikey': SUPABASE_ANON_KEY },
          body: JSON.stringify({
            smtpEmail: s.emailInvioPromemoria, smtpPassword: s.passwordInvioPromemoria,
            to: email, toName: nome,
            subject: 'Prenotazione confermata - Greta\'s House',
            message: 'Gentile '+nome+',\n\nLa ringraziamo per la prenotazione presso Greta\'s House.\n\nUnita: '+roomName+'\nCheck-in: '+ultimaRicerca.checkin+'\nCheck-out: '+ultimaRicerca.checkout+'\nTotale: EUR '+totale.toFixed(2)+'\n\nLa contatteremo presto per i dettagli del check-in.\n\nCordiali saluti,\nGreta\'s House'
          })
        }).catch(function(){});
        if (s.email) {
          fetch(functionUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer '+SUPABASE_ANON_KEY, 'apikey': SUPABASE_ANON_KEY },
            body: JSON.stringify({
              smtpEmail: s.emailInvioPromemoria, smtpPassword: s.passwordInvioPromemoria,
              to: s.email, toName: 'Greta\'s House',
              subject: 'Nuova prenotazione dal sito - '+nome,
              message: 'Nuova prenotazione ricevuta dal sito web:\n\nOspite: '+nome+' ('+email+', '+telefono+')\nUnita: '+roomName+'\nCheck-in: '+ultimaRicerca.checkin+'\nCheck-out: '+ultimaRicerca.checkout+'\nTotale: EUR '+totale.toFixed(2)+(note?'\nNote: '+note:'')+'\n\nVai su DeskFlow - Prenotazioni per gestirla.'
            })
          }).catch(function(){});
        }
      }
    } catch (eNotif) { console.error('Notifica email non riuscita (la prenotazione resta comunque salvata):', eNotif); }

    document.getElementById('book-overlay').innerHTML =
      '<div class="modalbox"><div class="ok-box">' +
        '<div class="tick">OK</div>' +
        '<h2>Prenotazione confermata!</h2>' +
        '<p style="color:#8a7a77;font-size:13.5px">Riceverai una email di conferma a breve. Grazie per aver scelto Greta\'s House!</p>' +
        '<button class="btn btn-primary" onclick="document.getElementById(\'book-overlay\').remove(); location.reload();">Chiudi</button>' +
      '</div></div>';
  } catch (err) {
    console.error(err);
    btn.disabled = false;
    btn.textContent = 'Conferma prenotazione';
    alert('Errore durante la prenotazione: ' + (err.message || 'sconosciuto') + '\nRiprova, oppure contattaci direttamente.');
  }
}
</script>
